spring.application.name=climax-api
server.port=${PORT:8080}

# Proveedor de datos: Open-Meteo (gratuito y sin API key)
climax.open-meteo.forecast-url=https://api.open-meteo.com/v1/forecast
climax.open-meteo.air-quality-url=https://air-quality-api.open-meteo.com/v1/air-quality
climax.open-meteo.geocoding-url=https://geocoding-api.open-meteo.com/v1/search
climax.nominatim.reverse-url=https://nominatim.openstreetmap.org/reverse

# Orígenes permitidos para CORS (separados por comas)
climax.cors.allowed-origins=${CLIMAX_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Caché en memoria: la previsión se refresca cada 10 minutos
spring.cache.cache-names=forecast,geocoding,reverse,mapCities
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

management.endpoints.web.exposure.include=health
spring.jackson.default-property-inclusion=non_null
